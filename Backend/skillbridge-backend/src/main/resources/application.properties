spring.application.name=skillbridge-backend

# Server Port Configuration (Railway provides PORT env variable)
server.port=${PORT:8080}

# Dynamic Database Configuration (Supports Railway MySQL and Local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQLURL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:skillbridge_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Akni@2006}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini API Key (Server-Side Only)
gemini.api.key=${GEMINI_API_KEY:}

# Security / JWT Secret Key
jwt.secret=${JWT_SECRET:SkillBridgeSecretKeySkillBridgeSecretKey123456}

# Storage Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}